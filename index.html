<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Copa Discord</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏆</text></svg>">
<style>
@import url("https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap");
:root{--bg:#07070f;--card:rgba(20,20,38,.62);--tx:#eef0ff;--mut:#8b90b8;--line:rgba(140,150,255,.18);--ac:#7c5cff;--ac2:#00e5ff;--pink:#ff2d95;--gold:#ffd447;--silver:#c9d3ea;--bronze:#e08a4b;color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--tx);font-family:"Rajdhani","Segoe UI",system-ui,sans-serif;font-weight:600;font-size:1.05rem;background:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-20%;z-index:-2;background:
 radial-gradient(40% 35% at 15% 20%,rgba(124,92,255,.45),transparent 70%),
 radial-gradient(35% 30% at 85% 15%,rgba(0,229,255,.28),transparent 70%),
 radial-gradient(45% 40% at 70% 90%,rgba(255,45,149,.30),transparent 70%),
 var(--bg);animation:drift 18s ease-in-out infinite alternate}
body::after{content:"";position:fixed;inset:0;z-index:-1;background-image:linear-gradient(rgba(140,150,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(140,150,255,.07) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 30%,#000 20%,transparent 75%)}
@keyframes drift{to{transform:translate3d(3%,2%,0) scale(1.08)}}
@keyframes shine{to{background-position:200% center}}
@keyframes pulse{50%{box-shadow:0 0 38px rgba(255,212,71,.45),inset 0 0 22px rgba(255,212,71,.12)}}
.w{max-width:960px;margin:0 auto;padding:34px 14px 60px}
h1{margin:0 0 22px;font-family:"Orbitron",system-ui,sans-serif;font-weight:900;text-transform:uppercase;letter-spacing:.04em;font-size:clamp(1.8rem,7vw,3.2rem);line-height:1.05;background:linear-gradient(90deg,var(--ac2),var(--ac),var(--pink),var(--ac2));background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:shine 6s linear infinite;filter:drop-shadow(0 0 18px rgba(124,92,255,.55))}
h2{display:flex;align-items:center;gap:10px;font-family:"Orbitron",system-ui,sans-serif;font-weight:800;font-size:.95rem;text-transform:uppercase;letter-spacing:.18em;color:var(--ac2);margin:38px 0 12px;text-shadow:0 0 14px rgba(0,229,255,.6)}
h2::before{content:"";width:28px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--ac2),var(--pink));box-shadow:0 0 12px var(--ac2)}
select,input,button{font:inherit;font-weight:700;color:var(--tx)}
select,input.t{background:rgba(10,10,24,.75);border:1px solid var(--line);border-radius:12px;padding:10px 14px;transition:.2s}
select:focus,input.t:focus{outline:none;border-color:var(--ac2);box-shadow:0 0 0 3px rgba(0,229,255,.18),0 0 18px rgba(0,229,255,.25)}
select option{background:#12122a;color:var(--tx)}
button{position:relative;border:0;border-radius:12px;padding:10px 18px;cursor:pointer;font-family:"Orbitron",system-ui,sans-serif;font-weight:800;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:linear-gradient(135deg,var(--ac),var(--pink));box-shadow:0 6px 22px rgba(124,92,255,.45);transition:transform .15s,box-shadow .15s,filter .15s}
button:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 10px 30px rgba(255,45,149,.5);filter:brightness(1.1)}
button:active{transform:translateY(0) scale(.98)}
button.sec{background:rgba(124,92,255,.14);border:1px solid var(--line);box-shadow:none;color:var(--tx)}
button.sec:hover{border-color:var(--ac2);box-shadow:0 0 22px rgba(0,229,255,.35);background:rgba(0,229,255,.1)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.card{position:relative;background:var(--card);border-radius:18px;overflow-x:auto;-webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06)}
.card::-webkit-scrollbar{height:8px}.card::-webkit-scrollbar-thumb{background:linear-gradient(90deg,var(--ac),var(--pink));border-radius:8px}
table{width:100%;border-collapse:collapse}
th,td{padding:13px 10px;text-align:center;border-bottom:1px solid rgba(140,150,255,.1);font-variant-numeric:tabular-nums;white-space:nowrap}
th{font-family:"Orbitron",system-ui,sans-serif;font-weight:700;font-size:.66rem;color:var(--mut);text-transform:uppercase;letter-spacing:.16em;background:rgba(124,92,255,.08)}
tbody tr{transition:background .2s}
tbody tr:hover{background:rgba(124,92,255,.14)}
tr:last-child td{border-bottom:0}
td.l,th.l{text-align:left}
.pos{width:56px;font-family:"Orbitron",system-ui,sans-serif;font-weight:900;color:var(--mut);font-size:1.15rem}
.pts{font-family:"Orbitron",system-ui,sans-serif;font-weight:900;font-size:1.35rem;color:var(--ac2);text-shadow:0 0 14px rgba(0,229,255,.7)}
#rb tr td:nth-child(2){font-size:1.2rem}
#rb tr.top{background:linear-gradient(90deg,rgba(255,212,71,.2),rgba(255,212,71,.04));animation:pulse 3s ease-in-out infinite}
#rb tr.top td:nth-child(2){color:var(--gold);text-shadow:0 0 16px rgba(255,212,71,.6);font-size:1.4rem}
#rb tr.top .pts{color:var(--gold);text-shadow:0 0 18px rgba(255,212,71,.9);font-size:1.6rem}
#rb tr.top .pos{filter:drop-shadow(0 0 10px rgba(255,212,71,.9));font-size:1.4rem}
#rb tr:nth-child(2) td:nth-child(2){color:var(--silver)}
#rb tr:nth-child(2) .pts{color:var(--silver);text-shadow:0 0 14px rgba(201,211,234,.6)}
#rb tr:nth-child(3) td:nth-child(2){color:var(--bronze)}
#rb tr:nth-child(3) .pts{color:var(--bronze);text-shadow:0 0 14px rgba(224,138,75,.6)}
td input{background:rgba(10,10,24,.4);border:1px solid transparent;border-radius:8px;padding:6px;text-align:center;width:64px;transition:.15s}
td input.nm{width:140px;text-align:left}
td input:hover{border-color:var(--line)}
td input:focus{outline:none;border-color:var(--ac2);box-shadow:0 0 14px rgba(0,229,255,.35);background:rgba(10,10,24,.8)}
td select{padding:6px 10px}
input[type=date]{color-scheme:dark}
.x{background:none;box-shadow:none;color:var(--mut);padding:2px 9px;font-size:.9rem}
.x:hover{background:none;color:var(--pink);box-shadow:none;filter:drop-shadow(0 0 8px var(--pink));transform:scale(1.2)}
.empty{padding:34px;text-align:center;color:var(--mut)}
.banner{background:rgba(255,45,149,.08);border:1px dashed var(--pink);border-radius:14px;padding:14px 16px;margin-bottom:18px;font-size:.95rem;line-height:1.5;box-shadow:0 0 30px rgba(255,45,149,.15)}
@media (max-width:600px){th,td{padding:10px 7px}.pos{width:42px}h2{letter-spacing:.1em}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="w">
  <h1>🏆 La Copa Discord</h1>
  <div id="banner"></div>
  <div class="bar" id="bar"></div>
  <div class="card"><table><thead id="rh"></thead><tbody id="rb"></tbody></table></div>
  <h2 id="hh">Historial de partidas</h2>
  <div class="card"><table><thead id="gh"></thead><tbody id="gb"></tbody></table></div>
  <div class="bar" id="addbar" style="margin-top:14px"></div>
</div>
<script>
// Datos de respaldo (se usan si no se encuentra data.json). Lo normal es editar data.json.
var DEFAULT_CATALOG = ["BAPBAP","VALO","CS","LOL","TFT","Age of Empires"];
var FALLBACK = {"catalog":DEFAULT_CATALOG,"seasons":{"2026":{"players":[],"games":[]}}};
var EDIT = location.hash === "#editar";
var DKEY = "copa-discord-borrador";
var S = null, cur = null;

function uid(){ return Math.random().toString(36).slice(2, 9); }
function el(tag, props, kids){
  var e = document.createElement(tag);
  for (var k in (props || {})){ if (k === "text") e.textContent = props[k]; else if (k === "class") e.className = props[k]; else e[k] = props[k]; }
  (kids || []).forEach(function(c){ e.appendChild(c); });
  return e;
}
function num(v){ v = parseFloat(String(v).replace(",", ".")); return isNaN(v) ? 0 : v; }
function today(){ var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function fdate(d){ if (!d) return "–"; var a = d.split("-"); return a.length === 3 ? a[2] + "/" + a[1] + "/" + a[0] : d; }
function gameSelect(value, onpick){
  var sel = el("select", {});
  var opts = S.catalog.slice(); if (value && opts.indexOf(value) < 0) opts.push(value);
  opts.forEach(function(n){ var o = el("option", { value: n, text: n }); o.selected = n === value; sel.appendChild(o); });
  sel.onchange = function(){ onpick(sel.value); };
  return sel;
}
function draft(){ try { localStorage.setItem(DKEY, JSON.stringify(S)); } catch (e) {} }

function ensure(){
  if (!S.catalog || !S.catalog.length) S.catalog = DEFAULT_CATALOG.slice();
  if (!S.seasons || !Object.keys(S.seasons).length){ S.seasons = {}; S.seasons[String(new Date().getFullYear())] = { players: [], games: [] }; }
  if (!cur || !S.seasons[cur]) cur = Object.keys(S.seasons).sort().slice(-1)[0];
}
function totals(){
  var s = S.seasons[cur];
  return s.players.map(function(p){
    var t = 0; s.games.forEach(function(g){ t += num((g.pts || {})[p.id]); });
    return { p: p, t: t };
  }).sort(function(a, b){ return b.t - a.t || a.p.n.localeCompare(b.p.n); });
}

function render(){
  ensure();
  var s = S.seasons[cur];

  var banner = document.getElementById("banner"); banner.innerHTML = "";
  if (EDIT){
    banner.className = "banner";
    banner.appendChild(el("div", { text: "Modo edición. Tus cambios quedan en este navegador hasta que toques “Descargar data.json” y subas ese archivo a GitHub (reemplazando el anterior)." }));
    var b1 = el("button", { text: "⬇ Descargar data.json", style: "margin-top:8px" });
    b1.onclick = function(){
      var a = el("a", { href: URL.createObjectURL(new Blob([JSON.stringify(S, null, 1)], { type: "application/json" })), download: "data.json" });
      document.body.appendChild(a); a.click(); a.remove();
    };
    var b2 = el("button", { text: "Descartar cambios", class: "sec", style: "margin:8px 0 0 8px" });
    b2.onclick = function(){ if (confirm("¿Descartar tus cambios y volver a la versión publicada?")){ localStorage.removeItem(DKEY); location.reload(); } };
    banner.appendChild(b1); banner.appendChild(b2);
  } else banner.className = "";

  var bar = document.getElementById("bar"); bar.innerHTML = "";
  var sel = el("select", { ariaLabel: "Temporada" });
  Object.keys(S.seasons).sort().reverse().forEach(function(y){ var o = el("option", { value: y, text: "Temporada " + y }); o.selected = y === cur; sel.appendChild(o); });
  sel.onchange = function(){ cur = sel.value; render(); };
  bar.appendChild(sel);
  if (EDIT){
    var ns = el("button", { text: "＋ Nueva temporada", class: "sec" });
    ns.onclick = function(){
      var y = prompt("¿Qué temporada querés crear?", String(parseInt(cur, 10) + 1)); if (!y) return; y = y.trim();
      if (!S.seasons[y]){
        var keep = confirm("¿Copiar los participantes de " + cur + " con todo en cero?\n\nAceptar = sí · Cancelar = temporada vacía");
        S.seasons[y] = { players: keep ? s.players.map(function(p){ return { id: uid(), n: p.n }; }) : [], games: [] };
      }
      cur = y; draft(); render();
    };
    bar.appendChild(ns);
  }

  // Ranking
  var rh = document.getElementById("rh"); rh.innerHTML = "";
  rh.appendChild(el("tr", {}, [el("th", { text: "#" }), el("th", { text: "Participante", class: "l" }), el("th", { text: "Puntos" }), el("th", { text: "" })]));
  var rb = document.getElementById("rb"); rb.innerHTML = "";
  var tt = totals();
  if (!tt.length) rb.appendChild(el("tr", {}, [el("td", { colSpan: 4, class: "empty", text: EDIT ? "Agregá participantes abajo." : "Todavía no hay participantes." })]));
  var medals = ["🥇", "🥈", "🥉"];
  tt.forEach(function(x, i){
    var nameCell = el("td", { class: "l" });
    if (EDIT){
      var inp = el("input", { class: "nm", value: x.p.n });
      inp.onchange = function(){ x.p.n = inp.value.trim() || x.p.n; draft(); render(); };
      nameCell.appendChild(inp);
    } else { nameCell.textContent = x.p.n; nameCell.style.fontWeight = "600"; }
    var del = el("td", {});
    if (EDIT){
      var d = el("button", { text: "✕", class: "x", title: "Eliminar" });
      d.onclick = function(){
        if (!confirm("¿Eliminar a " + x.p.n + " de la temporada " + cur + "?")) return;
        s.players = s.players.filter(function(p){ return p.id !== x.p.id; }); draft(); render();
      };
      del.appendChild(d);
    }
    rb.appendChild(el("tr", { class: i === 0 ? "top" : "" }, [el("td", { class: "pos", text: medals[i] || String(i + 1) }), nameCell, el("td", { class: "pts", text: String(Math.round(x.t * 100) / 100) }), del]));
  });

  // Juegos (matriz juegos x participantes)
  var order = tt.map(function(x){ return x.p; });
  var showG = order.length && (s.games.length || EDIT);
  document.getElementById("hh").style.display = showG ? "" : "none";
  document.getElementById("gh").parentNode.parentNode.style.display = showG ? "" : "none";
  var gh = document.getElementById("gh"); gh.innerHTML = "";
  var gb = document.getElementById("gb"); gb.innerHTML = "";
  if (showG){
    var hr = el("tr", {}, [el("th", { text: "Fecha" }), el("th", { text: "Juego", class: "l" })]);
    order.forEach(function(p){ hr.appendChild(el("th", { text: p.n })); });
    hr.appendChild(el("th", { text: "" })); gh.appendChild(hr);
    s.games.slice().reverse().forEach(function(g){
      var tr = el("tr", {});
      var dcell = el("td", {});
      if (EDIT){ var di = el("input", { type: "date", value: g.d || "", style: "width:140px" }); di.onchange = function(){ g.d = di.value; draft(); render(); }; dcell.appendChild(di); }
      else dcell.textContent = fdate(g.d);
      tr.appendChild(dcell);
      var c = el("td", { class: "l" });
      if (EDIT){ c.appendChild(gameSelect(g.n, function(v){ g.n = v; draft(); render(); })); }
      else { c.textContent = g.n; c.style.fontWeight = "600"; }
      tr.appendChild(c);
      order.forEach(function(p){
        var cell = el("td", {});
        var v = (g.pts || {})[p.id];
        if (EDIT){
          var pi = el("input", { type: "number", step: "any", value: v === undefined ? "" : v, placeholder: "–" });
          pi.onchange = function(){ g.pts = g.pts || {}; if (pi.value === "") delete g.pts[p.id]; else g.pts[p.id] = num(pi.value); draft(); render(); };
          cell.appendChild(pi);
        } else cell.textContent = v === undefined ? "–" : String(v);
        tr.appendChild(cell);
      });
      var dc = el("td", {});
      if (EDIT){
        var gd = el("button", { text: "✕", class: "x", title: "Eliminar juego" });
        gd.onclick = function(){ if (!confirm("¿Eliminar el juego “" + g.n + "”?")) return; s.games = s.games.filter(function(z){ return z.id !== g.id; }); draft(); render(); };
        dc.appendChild(gd);
      }
      tr.appendChild(dc); gb.appendChild(tr);
    });
  }

  // Barra de agregar (solo modo edición)
  var ab = document.getElementById("addbar"); ab.innerHTML = "";
  if (EDIT){
    var pn = el("input", { class: "t", placeholder: "Nuevo participante", maxLength: 30 });
    var pb = el("button", { text: "Agregar participante" });
    var addP = function(){ var n = pn.value.trim(); if (!n) return; s.players.push({ id: uid(), n: n }); draft(); render(); };
    pb.onclick = addP; pn.onkeydown = function(e){ if (e.key === "Enter") addP(); };
    ab.appendChild(pn); ab.appendChild(pb);
    var row2 = el("div", { class: "bar", style: "width:100%;margin:0" });
    var gs = gameSelect(S.catalog[0], function(){});
    var gd = el("input", { class: "t", type: "date", value: today() });
    var gb2 = el("button", { text: "Agregar partida" });
    gb2.onclick = function(){ s.games.push({ id: uid(), n: gs.value, d: gd.value || today(), pts: {} }); draft(); render(); };
    var gn = el("button", { text: "＋ Juego a la lista", class: "sec" });
    gn.onclick = function(){ var n = (prompt("Nombre del juego nuevo:") || "").trim(); if (!n || S.catalog.indexOf(n) >= 0) return; S.catalog.push(n); draft(); render(); };
    [gs, gd, gb2, gn].forEach(function(n){ row2.appendChild(n); });
    ab.appendChild(row2);
  }
}

window.addEventListener("hashchange", function(){ location.reload(); });

(async function(){
  try {
    var r = await fetch("data.json?" + Date.now());
    S = r.ok ? await r.json() : FALLBACK;
  } catch (e) { S = FALLBACK; }
  if (EDIT){
    try { var d = localStorage.getItem(DKEY); if (d) S = JSON.parse(d); } catch (e) {}
  }
  render();
})();
</script>
</body>
</html>
